site_name: John Kane
site_url: https://jkane.info
site_description: John's Personal github site
site_author: John.Kane@Kane.net
copyright: Copyright &copy; 2021 <a href="mailto:John.Kane@Kane.net">John Kane</a>

repo_url: https://github.com/jakane/jakane.github.io/
edit_uri: edit/main/docs/

theme:
    name: material
    highlightjs: true
    hljs_languages:
        - django
        - html
        - python
        - yaml
    custom_dir: overrides

extra_css:
    - stylesheets/extra.css
    - stylesheets/style.css

markdown_extensions:
    - abbr
    - admonition
    - codehilite
    - def_list
    - fenced_code
    - footnotes
    - pymdownx.emoji:
        emoji_index: !!python/name:materialx.emoji.twemoji
        emoji_generator: !!python/name:materialx.emoji.to_svg
    - pymdownx.tasklist:
        clickable_checkbox: false
        custom_checkbox: true
    - sane_lists
    - smarty:
        smart_dashes: true
        smart_quotes: true
        smart_angled_quotes: true
        smart_ellipses: true
    - tables
    - toc:
        permalink: "#"
        baselevel: 1
        separator: "_"

plugins:
    - git-revision-date
    - search

nav:
    - Home: README.md
    - Contact: contact.md
    - Patents: patents/patents.md

